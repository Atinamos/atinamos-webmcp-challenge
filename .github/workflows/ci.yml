name: WebMCP Challenge Public Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public test and demo dependencies
        run: |
          python -m pip install pytest
          python -m pip install -r demo/requirements.txt
      - name: Run public source and runnable-harness regression checks
        run: PYTHONPATH=. pytest -q
      - name: Check published JavaScript syntax
        run: |
          node --check src/agent-shop-webmcp.js
          node --check src/agent-shop-webmcp-activity.js
          node --check src/agent-shop-result-actions.js
          node --check src/agent-shop-result-view.js
          node --check src/agent-shop-session-durability.js
          node --check src/agent-shop-payment-resume.js
          node --check demo/demo-activity.js
